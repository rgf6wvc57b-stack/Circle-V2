name: PR Tests

on:
  pull_request:

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install headless browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            fonts-liberation \
            libasound2t64 \
            libatk-bridge2.0-0t64 \
            libatk1.0-0t64 \
            libcups2t64 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0t64 \
            libnspr4 \
            libnss3 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            xdg-utils \
            wget
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb

      - name: Install Node dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run geometry studies tests
        run: npm run test:geometry-studies

      - name: Run calm framing tests
        run: npm run test:framing-calm

      - name: Run volumetric tree tests
        run: npm run test:volumetric-tree

      - name: Run construction step tests
        run: npm run test:construction-step

      - name: Run tree of life verification
        run: node scripts/verify-tree-of-life.mjs

      - name: Run flower tests
        run: npm run test:flower
